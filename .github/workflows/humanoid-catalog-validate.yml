name: Validate Humanoid Character Library

on:
  pull_request:
    paths:
      - 'catalog/humanoids/**'
      - '.github/workflows/humanoid-catalog-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run Humanoid Catalog Unit & Secret-Leak Tests
        run: node --test catalog/humanoids/tools/humanoid-library.test.mjs
