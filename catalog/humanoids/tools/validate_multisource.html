<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Humanoid Library Multi-Source WebGL2 Validation</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #161b22; color: #e6edf3; font-family: ui-monospace, monospace; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 8px; left: 8px; background: rgba(13,17,23,0.82); padding: 6px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">ready</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(768, 768, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const isWebGL2 = renderer.capabilities.isWebGL2;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b2230);

    const hemi = new THREE.HemisphereLight(0xf6f8ff, 0x2c3340, 1.35);
    const key = new THREE.DirectionalLight(0xffffff, 1.7);
    key.position.set(3.2, 5.2, 4.0);
    const rim = new THREE.DirectionalLight(0xaad0ff, 0.75);
    rim.position.set(-3.5, 3.0, -3.5);
    const grid = new THREE.GridHelper(6, 12, 0x445066, 0x2c3444);
    scene.add(hemi, key, rim, grid);

    const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 100);
    const loader = new GLTFLoader();
    const hud = document.getElementById('hud');

    function disposeObject(root) {
      if (!root) return;
      root.traverse((obj) => {
        if (obj.isSkinnedMesh && obj.skeleton) obj.skeleton.dispose();
        if (obj.geometry) obj.geometry.dispose();
        const mats = Array.isArray(obj.material) ? obj.material : obj.material ? [obj.material] : [];
        for (const mat of mats) {
          for (const v of Object.values(mat)) {
            if (v && v.isTexture) v.dispose();
          }
          mat.dispose();
        }
      });
    }

    function measurePixelCoverage() {
      const gl = renderer.getContext();
      const w = renderer.domElement.width;
      const h = renderer.domElement.height;
      const buf = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      let nonBg = 0;
      const step = 4;
      let total = 0;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y * w + x) * 4;
          const r = buf[idx], g = buf[idx + 1], b = buf[idx + 2];
          // background #1b2230 -> (27, 34, 48)
          if (Math.abs(r - 27) > 10 || Math.abs(g - 34) > 10 || Math.abs(b - 48) > 10) {
            nonBg++;
          }
          total++;
        }
      }
      return { nonBg, total, ratio: Number((nonBg / total).toFixed(4)) };
    }

    function computeSceneStats(root) {
      let meshes = 0, skinnedMeshes = 0, triangles = 0;
      const bones = new Set();
      root.traverse((o) => {
        if (o.isMesh && o.geometry) {
          meshes++;
          if (o.isSkinnedMesh) skinnedMeshes++;
          const g = o.geometry;
          const cnt = g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0);
          triangles += Math.floor(cnt / 3);
        }
        if (o.isBone) bones.add(o.name);
      });
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      return {
        meshes,
        skinnedMeshes,
        triangles,
        boneCount: bones.size,
        boundsMin: box.min.toArray().map((n) => Number(n.toFixed(4))),
        boundsMax: box.max.toArray().map((n) => Number(n.toFixed(4))),
        dimensions: size.toArray().map((n) => Number(n.toFixed(4))),
        center: center.toArray(),
      };
    }

    function frameCamera(center, dims, signZ) {
      const h = Math.max(dims[1], 0.8);
      const radius = Math.max(h * 1.45, 1.8);
      camera.position.set(radius * 0.52 * signZ, center[1] + h * 0.14, radius * 0.92 * signZ);
      camera.lookAt(center[0], center[1], center[2]);
      camera.updateMatrixWorld();
    }

    async function loadGLB(url) {
      return await loader.loadAsync(url);
    }

    function filterClipToTargetBones(clip, targetRoot) {
      const valid = new Set();
      targetRoot.traverse((o) => valid.add(o.name));
      const kept = [];
      const dropped = [];
      for (const t of clip.tracks) {
        const nodeName = t.name.split('.')[0];
        if (valid.has(nodeName)) kept.push(t.clone());
        else dropped.push(nodeName);
      }
      return {
        clip: new THREE.AnimationClip(clip.name, clip.duration, kept),
        keptTracks: kept.length,
        droppedNodes: [...new Set(dropped)],
      };
    }

    window.__runCase = async function runCase(cfg) {
      hud.textContent = cfg.id;
      const group = new THREE.Group();
      scene.add(group);
      const mixers = [];
      let activeClipName = null;
      let clipFilterReport = null;
      let retargetReport = null;

      try {
        const primary = await loadGLB(cfg.modelUrl);
        group.add(primary.scene);

        if (cfg.extraParts && cfg.extraParts.length) {
          for (const partUrl of cfg.extraParts) {
            const p = await loadGLB(partUrl);
            group.add(p.scene);
          }
        }

        if (cfg.attachAccessory) {
          const acc = await loadGLB(cfg.attachAccessory.url);
          const sanitizedBone = THREE.PropertyBinding.sanitizeNodeName(cfg.attachAccessory.bone);
          const slot = primary.scene.getObjectByName(cfg.attachAccessory.bone) || primary.scene.getObjectByName(sanitizedBone);
          if (slot) {
            slot.add(acc.scene);
          } else {
            throw new Error(`Accessory slot bone not found: ${cfg.attachAccessory.bone} (or ${sanitizedBone})`);
          }
        }

        let clip = null;
        let animGltf = null;
        if (cfg.animUrl) {
          animGltf = await loadGLB(cfg.animUrl);
          clip = cfg.clipName
            ? animGltf.animations.find((c) => c.name === cfg.clipName) || animGltf.animations[0]
            : animGltf.animations[0];
          if (!clip) throw new Error(`No clip found in ${cfg.animUrl}`);
        } else if (primary.animations && primary.animations.length) {
          clip = cfg.clipName
            ? primary.animations.find((c) => c.name === cfg.clipName) || primary.animations[0]
            : primary.animations[0];
        }

        if (cfg.retargetFrom && clip && animGltf) {
          let srcSkin = null;
          let dstSkin = null;
          animGltf.scene.traverse((o) => { if (!srcSkin && o.isSkinnedMesh) srcSkin = o; });
          primary.scene.traverse((o) => { if (!dstSkin && o.isSkinnedMesh) dstSkin = o; });
          if (srcSkin && dstSkin && cfg.retargetNames) {
            const sanitizedNames = {};
            for (const [dstBone, srcBone] of Object.entries(cfg.retargetNames)) {
              sanitizedNames[THREE.PropertyBinding.sanitizeNodeName(dstBone)] = THREE.PropertyBinding.sanitizeNodeName(srcBone);
            }
            const dstSaved = dstSkin.skeleton.bones.map((b) => ({
              bone: b,
              pos: b.position.clone(),
              quat: b.quaternion.clone(),
              scale: b.scale.clone(),
            }));
            animGltf.scene.updateMatrixWorld(true);
            primary.scene.updateMatrixWorld(true);
            const localOffsets = {};
            if (cfg.useRestOffsets) {
              const srcQ = new THREE.Quaternion();
              const dstQ = new THREE.Quaternion();
              const srcScale = new THREE.Vector3();
              const srcPos = new THREE.Vector3();
              for (const b of dstSkin.skeleton.bones) {
                const srcName = sanitizedNames[b.name];
                if (!srcName) continue;
                const sb = animGltf.scene.getObjectByName(srcName);
                if (!sb) continue;
                sb.matrixWorld.decompose(srcPos, srcQ, srcScale);
                b.matrixWorld.decompose(srcPos, dstQ, srcScale);
                // R_src * offset = R_dst  =>  offset = R_src^-1 * R_dst
                const offQ = srcQ.clone().invert().multiply(dstQ);
                localOffsets[b.name] = new THREE.Matrix4().makeRotationFromQuaternion(offQ);
              }
            }
            const retargeted = SkeletonUtils.retargetClip(dstSkin, srcSkin, clip, {
              names: sanitizedNames,
              hip: THREE.PropertyBinding.sanitizeNodeName(cfg.retargetHip || 'Hips'),
              preservePosition: false,
              useFirstFramePosition: false,
              useTargetMatrix: true,
              localOffsets: cfg.useRestOffsets ? localOffsets : undefined,
            });
            // Strip position tracks if hip translation differs in unit/parent scale, keeping pure orientation retarget
            if (cfg.rotationTracksOnly) {
              retargeted.tracks = retargeted.tracks.filter((t) => !t.name.endsWith('.position'));
            }
            for (const s of dstSaved) {
              s.bone.position.copy(s.pos);
              s.bone.quaternion.copy(s.quat);
              s.bone.scale.copy(s.scale);
            }
            dstSkin.skeleton.bones.forEach((b) => b.updateMatrixWorld());
            activeClipName = retargeted.name;
            retargetReport = {
              sourceTracks: clip.tracks.length,
              retargetedTracks: retargeted.tracks.length,
              sourceBones: srcSkin.skeleton.bones.length,
              targetBones: dstSkin.skeleton.bones.length,
              usedRestOffsets: Boolean(cfg.useRestOffsets),
            };
            const mixer = new THREE.AnimationMixer(dstSkin);
            const action = mixer.clipAction(retargeted);
            action.play();
            mixer.update(cfg.sampleTime ?? 0.35);
            mixers.push(mixer);
          } else {
            throw new Error('Missing srcSkin, dstSkin, or retargetNames for retarget test');
          }
        } else if (clip) {
          activeClipName = clip.name;
          const roots = cfg.extraParts ? group.children : [primary.scene];
          for (const r of roots) {
            const filtered = filterClipToTargetBones(clip, r);
            if (!clipFilterReport) {
              clipFilterReport = { keptTracks: filtered.keptTracks, droppedNodesCount: filtered.droppedNodes.length };
            }
            const mixer = new THREE.AnimationMixer(r);
            const act = mixer.clipAction(filtered.clip);
            act.play();
            mixer.update(cfg.sampleTime ?? 0.35);
            mixers.push(mixer);
          }
        }

        group.updateMatrixWorld(true);
        const stats = computeSceneStats(group);

        frameCamera(stats.center, stats.dimensions, 1);
        grid.visible = false;
        renderer.render(scene, camera);
        const covPos = measurePixelCoverage();
        grid.visible = true;
        renderer.render(scene, camera);
        const pngPos = renderer.domElement.toDataURL('image/png');

        frameCamera(stats.center, stats.dimensions, -1);
        grid.visible = false;
        renderer.render(scene, camera);
        const covNeg = measurePixelCoverage();
        grid.visible = true;
        renderer.render(scene, camera);
        const pngNeg = renderer.domElement.toDataURL('image/png');

        const glErr = renderer.getContext().getError();
        return {
          ok: true,
          id: cfg.id,
          isWebGL2,
          glError: glErr,
          stats,
          activeClipName,
          clipFilterReport,
          retargetReport,
          coveragePositiveZ: covPos,
          coverageNegativeZ: covNeg,
          pngPos,
          pngNeg,
          memoryBeforeDispose: { ...renderer.info.memory },
        };
      } finally {
        for (const m of mixers) m.stopAllAction();
        scene.remove(group);
        disposeObject(group);
        renderer.renderLists.dispose();
      }
    };

    window.__runDisposalCycle = async function runDisposalCycle(modelUrl, cycles = 5) {
      const snapshots = [];
      for (let i = 0; i < cycles; i++) {
        const gltf = await loadGLB(modelUrl);
        scene.add(gltf.scene);
        const s = computeSceneStats(gltf.scene);
        frameCamera(s.center, s.dimensions, 1);
        renderer.render(scene, camera);
        const during = { ...renderer.info.memory };
        scene.remove(gltf.scene);
        disposeObject(gltf.scene);
        renderer.renderLists.dispose();
        renderer.render(scene, camera);
        const after = { ...renderer.info.memory };
        snapshots.push({ cycle: i + 1, during, after });
      }
      return snapshots;
    };

    window.__validatorReady = true;
  </script>
</body>
</html>
